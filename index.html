<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Saturn System — Tilted 3D</title>
<style>
:root{
  --bg:#050608;
  --panel:rgba(8,10,14,.88);
  --text:#f2f2f2;
  --muted:#aeb4be;
  --yellow:#f3d36a;
  --purple:#9f7dff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  height:100%;
  overflow:hidden;
}
#app{position:fixed;inset:0}
.layerCanvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#dynamicCanvas{touch-action:none}

.topbar{
  position:fixed;
  top:max(8px, env(safe-area-inset-top));
  right:8px;
  z-index:30;
}
.iconBtn{
  width:36px;
  height:36px;
  border-radius:999px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid rgba(255,255,255,.14);
  background:rgba(8,10,14,.78);
  color:var(--text);
  font-size:18px;
  font-weight:700;
  backdrop-filter:blur(8px);
  touch-action:manipulation;
}

.infoSheet{
  position:fixed;
  top:max(50px, calc(env(safe-area-inset-top) + 50px));
  right:8px;
  width:min(88vw, 320px);
  max-height:min(62vh, 520px);
  overflow:auto;
  background:var(--panel);
  border:1px solid rgba(255,255,255,.08);
  border-radius:14px;
  padding:12px;
  display:none;
  z-index:35;
  backdrop-filter:blur(10px);
}
.infoSheet.open{display:block}
.title{font-size:14px;font-weight:700;margin-bottom:8px}
.meta{font-size:11px;color:var(--muted);line-height:1.4}
.legend{display:grid;gap:5px;font-size:11px;color:var(--muted);margin-top:10px}

.controls{
  position:fixed;
  left:8px;
  right:8px;
  bottom:max(8px, env(safe-area-inset-bottom));
  z-index:25;
}
.panel{
  background:rgba(8,10,14,.78);
  backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.08);
  border-radius:14px;
  padding:8px;
}
.grid.oneRow{
  display:grid;
  grid-template-columns:repeat(4, minmax(0,1fr));
  gap:6px;
}
button.control{
  appearance:none;
  min-height:42px;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.06);
  color:var(--text);
  border-radius:10px;
  padding:8px 6px;
  font-size:11px;
  line-height:1.15;
  font-weight:700;
  text-align:center;
  touch-action:manipulation;
}
button.control.active{
  background:rgba(243,211,106,.16);
  border-color:rgba(243,211,106,.45);
  color:var(--yellow);
}

.infoBox{
  position:fixed;
  left:8px;
  right:8px;
  bottom:max(66px, calc(env(safe-area-inset-bottom) + 66px));
  margin:0 auto;
  width:min(92vw, 340px);
  background:var(--panel);
  border:1px solid rgba(255,255,255,.08);
  border-radius:12px;
  padding:10px 12px;
  font-size:12px;
  line-height:1.35;
  display:none;
  z-index:28;
}

.controls,.controls *,.topbar,.topbar *,.infoSheet,.infoSheet *{touch-action:manipulation}

@media (max-width:390px){
  .controls{left:6px;right:6px}
  .grid.oneRow{gap:5px}
  button.control{min-height:40px;font-size:10px;padding:7px 4px}
  .infoBox{bottom:max(70px, calc(env(safe-area-inset-bottom) + 70px))}
}
@media (min-width:700px){
  .controls{left:10px;right:10px;max-width:640px;margin:0 auto}
  .grid.oneRow{grid-template-columns:repeat(4, minmax(0,1fr))}
  button.control{font-size:12px;min-height:44px}
}
</style>
</head>
<body>
<div id="app">
  <canvas id="staticCanvas" class="layerCanvas"></canvas>
  <canvas id="dynamicCanvas" class="layerCanvas"></canvas>
</div>

<div class="topbar">
  <button type="button" id="infoBtn" class="iconBtn" aria-label="Информация">i</button>
</div>

<div id="infoSheet" class="infoSheet">
  <div class="title">Система Сатурна — объёмный вид</div>
  <div class="meta" id="scaleInfo"></div>
  <div class="legend">
    <div>Плоскость колец и орбит показана под углом 30°.</div>
    <div>Орбиты выглядят эллипсами за счёт проекции.</div>
    <div>Сатурн изображён как шар с полосами и полярным затемнением.</div>
    <div>Кольца имеют естественный бежево-золотистый оттенок.</div>
    <div>Подписи показываются у выбранного спутника.</div>
  </div>
</div>

<div class="controls">
  <div class="panel">
    <div class="grid oneRow">
      <button type="button" id="pauseBtn" class="control active">Пауза</button>
      <button type="button" id="realBtn" class="control">1 сек / сек</button>
      <button type="button" id="hourBtn" class="control">1 час / сек</button>
      <button type="button" id="labelsBtn" class="control active">Подписи</button>
    </div>
  </div>
</div>

<div class="infoBox" id="infoBox"></div>

<script>
/*
  ВАЖНО:
  Ниже сейчас стоит укороченный пример данных.
  Чтобы вернуть полную систему, замените массив moons
  на ваш полный массив из рабочей версии v6.
  Формат объекта:
  { name, diameter_km, sma_km, period_d }
*/

const moons = [
  { name:"Mimas",     diameter_km:396.4,  sma_km:186000,  period_d:0.94242 },
  { name:"Enceladus", diameter_km:504.2,  sma_km:238400,  period_d:1.37022 },
  { name:"Tethys",    diameter_km:1062.2, sma_km:295000,  period_d:1.88780 },
  { name:"Dione",     diameter_km:1122.8, sma_km:377700,  period_d:2.73692 },
  { name:"Rhea",      diameter_km:1527.6, sma_km:527200,  period_d:4.51750 },
  { name:"Titan",     diameter_km:5149.46,sma_km:1221900, period_d:15.94540 },
  { name:"Hyperion",  diameter_km:270.0,  sma_km:1481500, period_d:21.2767 },
  { name:"Iapetus",   diameter_km:1468.6, sma_km:3561700, period_d:79.3310 },
  { name:"Phoebe",    diameter_km:213.0,  sma_km:12929400,period_d:-550.30 }
];

const rings = [
  {name:"D Ring", inner_km:66900,   outer_km:74491},
  {name:"C Ring", inner_km:74491,   outer_km:91975},
  {name:"B Ring", inner_km:91975,   outer_km:117570},
  {name:"Cassini Division", inner_km:117500, outer_km:122050},
  {name:"A Ring", inner_km:122050,  outer_km:136770},
  {name:"Roche Division", inner_km:136770, outer_km:139380},
  {name:"F Ring", inner_km:139826,  outer_km:140612},
  {name:"Janus/Epimetheus Ring", inner_km:149000, outer_km:154000},
  {name:"G Ring", inner_km:166000,  outer_km:173200},
  {name:"E Ring", inner_km:180000,  outer_km:480000},
  {name:"Phoebe Ring", inner_km:7720000, outer_km:12500000}
];

const SATURN_RADIUS_KM = 58232;
const SATURN_DIAMETER_KM = SATURN_RADIUS_KM * 2;
const maxMoonRadiusKm = Math.max(...moons.map(m => m.sma_km));
const maxStructureKm = Math.max(maxMoonRadiusKm, ...rings.map(r => r.outer_km));
const allMoonCount = moons.length;
const majorTailNames = new Set(['Titan','Rhea','Iapetus','Dione','Tethys','Enceladus','Mimas']);
const coarsePointer = window.matchMedia('(pointer: coarse)').matches;
const isMobile = coarsePointer || /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
const targetFPS = isMobile ? 30 : 60;

const TILT_DEG = 30;
const TILT = TILT_DEG * Math.PI / 180;
const YSCALE = Math.cos(TILT);

function pxBucket(d){
  if (d < 10) return 1;
  if (d < 100) return 2;
  if (d < 300) return 3;
  if (d < 700) return 4;
  if (d < 1200) return 5;
  if (d < 2100) return 6;
  if (d < 4000) return 7;
  return 8;
}
function getCSS(name){
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}
function moonColor(m){
  return m.diameter_km > 1000 ? getCSS('--purple') : getCSS('--text');
}
function hashPhase(name){
  let h = 2166136261 >>> 0;
  for(let i=0;i<name.length;i++){
    h ^= name.charCodeAt(i);
    h = Math.imul(h,16777619);
  }
  return (h>>>0)/4294967295*Math.PI*2;
}

for (let i = 0; i < moons.length; i++) {
  const m = moons[i];
  m.sizePx = pxBucket(m.diameter_km);
  m.phase0 = hashPhase(m.name);
  m.direction = m.period_d < 0 ? -1 : 1;
  m.periodSec = Math.abs(m.period_d) * 86400;
  m.renderIndex = i;
}

const staticCanvas = document.getElementById('staticCanvas');
const dynamicCanvas = document.getElementById('dynamicCanvas');
const sctx = staticCanvas.getContext('2d');
const dctx = dynamicCanvas.getContext('2d');
const infoBox = document.getElementById('infoBox');
const infoSheet = document.getElementById('infoSheet');
const scaleInfo = document.getElementById('scaleInfo');

const state = {
  w:0, h:0, dpr:1,
  centerX:0, centerY:0, offsetX:0, offsetY:0,
  kmPerPx:1, baseKmPerPx:1,
  speedMode:0, showLabels:true,
  simSeconds:0, lastRenderTs:0,
  pointers:new Map(), pinchBaseKmPerPx:null, pinchBaseDistance:null, moved:false, downAt:0,
  selectedMoon:null, staticDirty:true, visibleMoons:[]
};

function setCanvasSize(canvas, ctx){
  canvas.width = Math.floor(innerWidth * state.dpr);
  canvas.height = Math.floor(innerHeight * state.dpr);
  canvas.style.width = innerWidth + 'px';
  canvas.style.height = innerHeight + 'px';
  ctx.setTransform(state.dpr,0,0,state.dpr,0,0);
}

function resize(){
  state.dpr = Math.max(1, window.devicePixelRatio || 1);
  state.w = innerWidth;
  state.h = innerHeight;
  state.centerX = innerWidth / 2;
  state.centerY = innerHeight / 2;
  setCanvasSize(staticCanvas, sctx);
  setCanvasSize(dynamicCanvas, dctx);
  if (!state.baseKmPerPx || !isFinite(state.baseKmPerPx)) fitAll();
  markStaticDirty();
  updateScaleInfo();
}

function fitAll(){
  const controlsHeight = state.w <= 390 ? 118 : 132;
  const usableX = state.w * 0.44;
  const usableY = Math.max(110, (state.h - controlsHeight) * 0.30);
  const usable = Math.min(usableX, usableY);
  state.baseKmPerPx = maxStructureKm / usable;
  state.kmPerPx = state.baseKmPerPx;
  state.offsetX = 0;
  state.offsetY = -18;
  markStaticDirty();
  updateScaleInfo();
}

function worldToScreen(xKm, yKm){
  return {
    x: state.centerX + state.offsetX + xKm / state.kmPerPx,
    y: state.centerY + state.offsetY + (yKm * YSCALE) / state.kmPerPx
  };
}
function kmRadiusToPx(km){ return km / state.kmPerPx; }

function orbitVisibleOnScreen(radiusPxX, radiusPxY){
  const margin = 24;
  const cx = state.centerX + state.offsetX;
  const cy = state.centerY + state.offsetY;
  const left = cx - radiusPxX, right = cx + radiusPxX, top = cy - radiusPxY, bottom = cy + radiusPxY;
  return !(right < -margin || left > state.w + margin || bottom < -margin || top > state.h + margin);
}

function updateScaleInfo(){
  const saturnPx = SATURN_DIAMETER_KM / state.kmPerPx;
  scaleInfo.innerHTML =
    'Масштаб: 1 px = <b>' + Math.round(state.kmPerPx).toLocaleString('ru-RU') + ' км</b><br>' +
    'Сатурн: <b>' + saturnPx.toFixed(2) + ' px</b> по диаметру<br>' +
    'Объектов: <b>' + allMoonCount + '</b><br>' +
    'Проекция: <b>' + TILT_DEG + '°</b>' + (isMobile ? ' · 30 FPS' : ' · 60 FPS');
}

function ringColor(alpha){
  return 'rgba(201,185,150,' + alpha + ')';
}

function drawRingBandHalf(innerKm, outerKm, alpha, frontHalf){
  const center = worldToScreen(0,0);
  const inner = kmRadiusToPx(innerKm);
  const outer = kmRadiusToPx(outerKm);
  const width = Math.max(outer - inner, 1);
  const rx = (inner + outer) / 2;
  const ry = rx * YSCALE;
  if (!orbitVisibleOnScreen(rx + width, ry + width)) return;

  sctx.save();
  sctx.translate(center.x, center.y);
  sctx.scale(1, YSCALE);
  sctx.beginPath();
  sctx.arc(0, 0, rx, frontHalf ? 0 : Math.PI, frontHalf ? Math.PI : Math.PI * 2, false);
  sctx.strokeStyle = ringColor(alpha);
  sctx.lineWidth = width;
  sctx.stroke();
  sctx.restore();
}

function drawSaturnSphere(){
  const center = worldToScreen(0,0);
  const r = Math.max(1, kmRadiusToPx(SATURN_RADIUS_KM));

  const shadowGrad = sctx.createRadialGradient(center.x - r*0.35, center.y - r*0.25, r*0.15, center.x, center.y, r);
  shadowGrad.addColorStop(0.00, '#f1d98d');
  shadowGrad.addColorStop(0.35, '#d8b867');
  shadowGrad.addColorStop(0.72, '#b38f4a');
  shadowGrad.addColorStop(1.00, '#745825');

  sctx.save();
  sctx.beginPath();
  sctx.arc(center.x, center.y, r, 0, Math.PI * 2);
  sctx.clip();

  sctx.fillStyle = shadowGrad;
  sctx.fillRect(center.x - r, center.y - r, r * 2, r * 2);

  const bandColors = [
    ['rgba(236,213,155,0.90)', -0.72, 0.16],
    ['rgba(201,168,108,0.45)', -0.48, 0.10],
    ['rgba(236,213,155,0.80)', -0.26, 0.14],
    ['rgba(180,145,86,0.35)', -0.08, 0.08],
    ['rgba(233,204,140,0.75)', 0.06, 0.14],
    ['rgba(170,134,78,0.28)', 0.28, 0.09],
    ['rgba(227,199,139,0.68)', 0.44, 0.12],
    ['rgba(205,171,116,0.32)', 0.63, 0.10]
  ];

  for (const [color, pos, h] of bandColors){
    const y = center.y + r * pos;
    const hg = r * h;
    const g = sctx.createLinearGradient(0, y - hg, 0, y + hg);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(0.5, color);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    sctx.fillStyle = g;
    sctx.fillRect(center.x - r, y - hg, r * 2, hg * 2);
  }

  const poleGradTop = sctx.createRadialGradient(center.x, center.y - r*0.9, r*0.05, center.x, center.y - r*0.75, r*0.7);
  poleGradTop.addColorStop(0, 'rgba(110,88,53,0.22)');
  poleGradTop.addColorStop(1, 'rgba(0,0,0,0)');
  sctx.fillStyle = poleGradTop;
  sctx.fillRect(center.x - r, center.y - r, r * 2, r);

  const edgeGrad = sctx.createRadialGradient(center.x - r*0.3, center.y - r*0.3, r*0.1, center.x, center.y, r);
  edgeGrad.addColorStop(0.0, 'rgba(255,255,255,0.0)');
  edgeGrad.addColorStop(0.75, 'rgba(0,0,0,0.0)');
  edgeGrad.addColorStop(1.0, 'rgba(0,0,0,0.28)');
  sctx.fillStyle = edgeGrad;
  sctx.fillRect(center.x - r, center.y - r, r * 2, r * 2);

  const hi = sctx.createRadialGradient(center.x - r*0.38, center.y - r*0.34, r*0.02, center.x - r*0.34, center.y - r*0.28, r*0.65);
  hi.addColorStop(0, 'rgba(255,255,255,0.28)');
  hi.addColorStop(1, 'rgba(255,255,255,0)');
  sctx.fillStyle = hi;
  sctx.fillRect(center.x - r, center.y - r, r * 2, r * 2);

  sctx.restore();

  sctx.beginPath();
  sctx.arc(center.x, center.y, r, 0, Math.PI * 2);
  sctx.strokeStyle = 'rgba(255,255,255,0.18)';
  sctx.lineWidth = 1;
  sctx.stroke();
}

function drawStaticOrbits(){
  const center = worldToScreen(0,0);
  for (const m of state.visibleMoons){
    if (majorTailNames.has(m.name)) continue;
    const rx = kmRadiusToPx(m.sma_km);
    const ry = rx * YSCALE;
    if (rx < 0.7 || !orbitVisibleOnScreen(rx, ry)) continue;

    const base = m.diameter_km < 100 ? [200,205,210] : [243,211,106];
    const alpha = m.diameter_km < 100 ? 0.05 : 0.10;

    sctx.save();
    sctx.translate(center.x, center.y);
    sctx.scale(1, YSCALE);
    sctx.beginPath();
    sctx.arc(0, 0, rx, 0, Math.PI * 2);
    sctx.strokeStyle = 'rgba(' + base[0] + ',' + base[1] + ',' + base[2] + ',' + alpha.toFixed(3) + ')';
    sctx.lineWidth = 1;
    sctx.stroke();
    sctx.restore();
  }
}

function drawStaticScene(){
  sctx.clearRect(0,0,state.w,state.h);
  state.visibleMoons = moons.slice();
  drawStaticOrbits();

  for (const r of rings){
    const alpha = r.outer_km <= 480000 ? 0.50 : 0.10;
    drawRingBandHalf(r.inner_km, r.outer_km, alpha * 0.70, false);
  }

  drawSaturnSphere();

  for (const r of rings){
    const alpha = r.outer_km <= 480000 ? 0.50 : 0.10;
    drawRingBandHalf(r.inner_km, r.outer_km, alpha, true);
  }

  state.staticDirty = false;
}

function drawTailOrbit(m, thetaNow){
  const center = worldToScreen(0,0);
  const rx = kmRadiusToPx(m.sma_km);
  const ry = rx * YSCALE;
  if (rx < 0.7 || !orbitVisibleOnScreen(rx, ry)) return;

  const segments = isMobile ? 12 : 18;
  const tailSpan = Math.PI * 0.75;
  const base = m.diameter_km < 100 ? [200,205,210] : [243,211,106];

  for (let i = 0; i < segments; i++) {
    const t0 = i / segments;
    const t1 = (i + 1) / segments;
    const a0 = thetaNow - m.direction * (t0 * tailSpan);
    const a1 = thetaNow - m.direction * (t1 * tailSpan);
    const alpha = (1 - t0) * 0.70;
    if (alpha <= 0.02) continue;

    dctx.save();
    dctx.translate(center.x, center.y);
    dctx.scale(1, YSCALE);
    dctx.beginPath();
    dctx.arc(0, 0, rx, a1, a0, m.direction < 0);
    dctx.strokeStyle = 'rgba(' + base[0] + ',' + base[1] + ',' + base[2] + ',' + alpha.toFixed(3) + ')';
    dctx.lineWidth = 1;
    dctx.stroke();
    dctx.restore();
  }
}

function drawMoon(m){
  const theta = m.phase0 + m.direction * (state.simSeconds / m.periodSec) * Math.PI * 2;
  const x = Math.cos(theta) * m.sma_km;
  const y = Math.sin(theta) * m.sma_km;
  const p = worldToScreen(x, y);
  m.screenX = p.x;
  m.screenY = p.y;

  const margin = 18;
  if (p.x < -margin || p.x > state.w + margin || p.y < -margin || p.y > state.h + margin) return;

  if (majorTailNames.has(m.name)) drawTailOrbit(m, theta);

  const s = m.sizePx;
  const outlineR = Math.sqrt(2) * s / 2 + 6;

  dctx.beginPath();
  dctx.arc(p.x, p.y, outlineR, 0, Math.PI * 2);
  dctx.strokeStyle = s <= 2 ? 'rgba(255,255,255,0.35)' : 'rgba(255,255,255,0.55)';
  dctx.lineWidth = 1;
  dctx.stroke();

  dctx.fillStyle = moonColor(m);
  dctx.fillRect(Math.round(p.x - s / 2), Math.round(p.y - s / 2), s, s);

  if (state.showLabels && state.selectedMoon && state.selectedMoon.name === m.name) {
    dctx.textAlign = 'center';
    dctx.fillStyle = '#ffffff';
    dctx.font = '10px system-ui,-apple-system,Segoe UI,Roboto,sans-serif';
    dctx.fillText(m.name, p.x, p.y - outlineR - 10);
    dctx.font = '6px system-ui,-apple-system,Segoe UI,Roboto,sans-serif';
    dctx.fillStyle = '#c7cbd1';
    dctx.fillText(m.diameter_km + ' км', p.x, p.y - outlineR - 2);
  }
}

function showInfo(m){
  state.selectedMoon = m || null;
  if (!m){
    infoBox.style.display = 'none';
    return;
  }
  infoBox.innerHTML =
    '<b>' + m.name + '</b><br>' +
    'Диаметр: ' + m.diameter_km + ' км<br>' +
    'Большая полуось: ' + Math.round(m.sma_km).toLocaleString('ru-RU') + ' км<br>' +
    'Период: ' + Math.abs(m.period_d).toLocaleString('ru-RU') + ' суток<br>' +
    'Направление: ' + (m.period_d < 0 ? 'ретроградное' : 'прямое');
  infoBox.style.display = 'block';
}

function markStaticDirty(){
  state.staticDirty = true;
}

function hitTest(x, y){
  let best = null, bestD = Infinity;
  for (const m of state.visibleMoons){
    if (typeof m.screenX !== 'number' || typeof m.screenY !== 'number') continue;
    const dx = x - m.screenX;
    const dy = y - m.screenY;
    const d = Math.hypot(dx, dy);
    const hitR = Math.max(16, Math.sqrt(2) * m.sizePx / 2 + 8);
    if (d <= hitR && d < bestD){
      best = m;
      bestD = d;
    }
  }
  return best;
}

function render(ts){
  if (!state.lastRenderTs) state.lastRenderTs = ts;
  const minFrame = 1000 / targetFPS;
  const elapsedMs = ts - state.lastRenderTs;
  if (elapsedMs < minFrame){
    requestAnimationFrame(render);
    return;
  }

  const dt = elapsedMs / 1000;
  state.lastRenderTs = ts;

  if (state.speedMode === 1) state.simSeconds += dt;
  if (state.speedMode === 3600) state.simSeconds += dt * 3600;

  if (state.staticDirty){
    drawStaticScene();
    updateScaleInfo();
  }

  dctx.clearRect(0,0,state.w,state.h);
  for (const m of state.visibleMoons) drawMoon(m);

  requestAnimationFrame(render);
}

function setSpeed(mode){
  state.speedMode = mode;
  document.getElementById('pauseBtn').classList.toggle('active', mode === 0);
  document.getElementById('realBtn').classList.toggle('active', mode === 1);
  document.getElementById('hourBtn').classList.toggle('active', mode === 3600);
}

function bindTap(id, fn){
  const el = document.getElementById(id);
  el.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    fn();
  }, false);
}

bindTap('pauseBtn', () => setSpeed(0));
bindTap('realBtn', () => setSpeed(1));
bindTap('hourBtn', () => setSpeed(3600));
bindTap('labelsBtn', () => {
  state.showLabels = !state.showLabels;
  document.getElementById('labelsBtn').classList.toggle('active', state.showLabels);
});
bindTap('infoBtn', () => infoSheet.classList.toggle('open'));

dynamicCanvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const beforeX = (e.clientX - state.centerX - state.offsetX) * state.kmPerPx;
  const beforeY = (e.clientY - state.centerY - state.offsetY) * state.kmPerPx;
  state.kmPerPx = Math.max(100, Math.min(maxStructureKm, state.kmPerPx * (e.deltaY > 0 ? 1.12 : 0.9)));
  state.offsetX = e.clientX - state.centerX - beforeX / state.kmPerPx;
  state.offsetY = e.clientY - state.centerY - beforeY / state.kmPerPx;
  markStaticDirty();
}, {passive:false});

dynamicCanvas.addEventListener('pointerdown', (e) => {
  dynamicCanvas.setPointerCapture(e.pointerId);
  state.pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  state.moved = false;
  state.downAt = performance.now();
});

dynamicCanvas.addEventListener('pointermove', (e) => {
  if (!state.pointers.has(e.pointerId)) return;
  const prev = state.pointers.get(e.pointerId);
  state.pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});

  if (state.pointers.size === 1) {
    const dx = e.clientX - prev.x;
    const dy = e.clientY - prev.y;
    if (Math.abs(dx) + Math.abs(dy) > 2) state.moved = true;
    state.offsetX += dx;
    state.offsetY += dy;
    markStaticDirty();
  } else if (state.pointers.size === 2) {
    state.moved = true;
    const pts = [...state.pointers.values()];
    const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    if (!state.pinchBaseDistance) {
      state.pinchBaseDistance = d;
      state.pinchBaseKmPerPx = state.kmPerPx;
    } else if (d > 0) {
      state.kmPerPx = Math.max(100, Math.min(maxStructureKm, state.pinchBaseKmPerPx * (state.pinchBaseDistance / d)));
      markStaticDirty();
    }
  }
});

function clearPointer(e){
  state.pointers.delete(e.pointerId);
  if (state.pointers.size < 2) {
    state.pinchBaseDistance = null;
    state.pinchBaseKmPerPx = null;
  }
}

dynamicCanvas.addEventListener('pointerup', (e) => {
  const wasTap = !state.moved && (performance.now() - state.downAt < 250);
  if (wasTap) {
    const hit = hitTest(e.clientX, e.clientY);
    if (hit) showInfo(hit);
    else showInfo(null);
  }
  clearPointer(e);
});
dynamicCanvas.addEventListener('pointercancel', clearPointer);
dynamicCanvas.addEventListener('click', (e) => {
  const hit = hitTest(e.clientX, e.clientY);
  if (hit) showInfo(hit);
  else showInfo(null);
});

window.addEventListener('resize', resize);
resize();
fitAll();
setSpeed(0);
requestAnimationFrame(render);
</script>
</body>
</html>
