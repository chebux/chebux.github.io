.iconBtn{

function generateOfflineMoons(){
  const moons = [];
  for (const m of keyMoons) moons.push({...m});

  const groups = [
    {prefix:'S/2019 S ', count:24, start:11200000, step:330000, diamMin:3, diamMax:5, retro:false, periodStart:445},
    {prefix:'S/2020 S ', count:28, start:11300000, step:310000, diamMin:2, diamMax:4, retro:false, periodStart:448},
    {prefix:'S/2023 S ', count:26, start:11600000, step:360000, diamMin:2, diamMax:4, retro:true, periodStart:470},
    {prefix:'S/2004 S ', count:24, start:15900000, step:270000, diamMin:3, diamMax:5, retro:true, periodStart:752},
    {prefix:'S/2005 S ', count:8,  start:11320000, step:980000, diamMin:3, diamMax:5, retro:false, periodStart:450},
    {prefix:'S/2006 S ', count:24, start:13190000, step:420000, diamMin:3, diamMax:5, retro:true, periodStart:566},
    {prefix:'S/2007 S ', count:10, start:11360000, step:610000, diamMin:3, diamMax:5, retro:true, periodStart:452}
  ];

  let usedNames = new Set(moons.map(m => m.name));
  for (const g of groups){
    for (let i = 1; i <= g.count; i++){
      const name = g.prefix + i;
      if (usedNames.has(name)) continue;
      const frac = i / g.count;
      const sma = g.start + g.step * i;
      const diam = g.diamMin + ((i * 37) % 100) / 100 * (g.diamMax - g.diamMin);
      const periodBase = g.periodStart + frac * 800;
      moons.push({
        name,
        diameter_km: Math.round(diam * 10) / 10,
        sma_km: sma,
        period_d: g.retro ? -periodBase : periodBase
      });
      usedNames.add(name);
    }
  }

  for (const m of moons){
    m.label = ruMap[m.name] ? `${ruMap[m.name]} - ${m.name}` : m.name;
  }

  return moons;
}

function approxOrbitalElements(m){
  const manual = {
    'Mimas':[1.57,0],'Enceladus':[0.0,0],'Tethys':[1.09,0],'Dione':[0.02,0],
    'Rhea':[0.35,0],'Titan':[0.35,0],'Hyperion':[0.43,0],'Iapetus':[15.47,0],
    'Phoebe':[175.3,255]
  };
  if (manual[m.name]) return {inc:manual[m.name][0], node:manual[m.name][1]};
  if (m.sma_km < 4000000) return {inc:hash01(m.name)*0.8, node:hash01(m.name+'node')*360};
  if (m.period_d < 0) return {inc:145 + hash01(m.name)*25, node:hash01(m.name+'node')*360};
  return {inc:30 + hash01(m.name)*20, node:hash01(m.name+'node')*360};
}

}

function formatMoney(n){
  return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
}
function updateMoneyBox(){
  moneyBox.textContent = formatMoney(state.money);
}
function formatDatePart(d){
  const dd = String(d.getUTCDate()).padStart(2,'0');
  const mm = String(d.getUTCMonth()+1).padStart(2,'0');
  const yyyy = d.getUTCFullYear();
  return `${dd}.${mm}.${yyyy}`;
}
function formatTimePart(d){
  const hh = String(d.getUTCHours()).padStart(2,'0');
  const mi = String(d.getUTCMinutes()).padStart(2,'0');
  const ss = String(d.getUTCSeconds()).padStart(2,'0');
  return `${hh}:${mi}:${ss}`;
}
function formatSimDate(ms){
  const d = new Date(ms);
  return `${formatDatePart(d)} ${formatTimePart(d)}`;
}
function updateSimTimeBox(){
  const d = new Date(SIM_START_MS + Math.round(state.simSeconds * 1000));
  timeBox.innerHTML = `<span style="font-weight:900;">${formatDatePart(d)}</span>&nbsp;&nbsp;<span style="font-weight:600;">${formatTimePart(d)}</span>`;
}

function setCanvasSize(canvas, ctx){
  canvas.width = Math.floor(innerWidth * state.dpr);
  canvas.height = Math.floor(innerHeight * state.dpr);
  canvas.style.width = innerWidth + 'px';
  canvas.style.height = innerHeight + 'px';
  ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
}
function resize(){
  state.dpr = Math.max(1, window.devicePixelRatio || 1);
  state.w = innerWidth; state.h = innerHeight;
  state.centerX = innerWidth / 2; state.centerY = innerHeight / 2;
  setCanvasSize(staticCanvas, sctx);
  setCanvasSize(dynamicCanvas, dctx);
  if (!state.baseKmPerPx || !isFinite(state.baseKmPerPx)) fitAll();
  markStaticDirty();
  updateScaleInfo();
}
function fitAll(){
  const controlsHeight = state.w <= 390 ? 118 : 132;
  const usableX = state.w * 0.46;
  const usableY = Math.max(110, (state.h - controlsHeight) * 0.34);
  const usable = Math.min(usableX, usableY);
  state.baseKmPerPx = maxStructureKm / usable;
  state.kmPerPx = state.baseKmPerPx;
  state.offsetX = 0;
  state.offsetY = -22;
  markStaticDirty();
  updateScaleInfo();
}
function worldToScreen(xKm, yKm){
  return {x: state.centerX + state.offsetX + xKm / state.kmPerPx, y: state.centerY + state.offsetY + yKm / state.kmPerPx};
}
function kmRadiusToPx(km){ return km / state.kmPerPx; }

function projectOrbitPoint(rKm, theta, incRad, nodeRad){
  const cu = Math.cos(theta), su = Math.sin(theta);
  let x = rKm * cu;
  let y = rKm * su * Math.cos(incRad);
  let z = rKm * su * Math.sin(incRad);

  const cO = Math.cos(nodeRad), sO = Math.sin(nodeRad);
  const x2 = x * cO - y * sO;
  const y2 = x * sO + y * cO;
  const z2 = z;

  const ct = Math.cos(VIEW_TILT_RAD), st = Math.sin(VIEW_TILT_RAD);
  const x3 = x2;
  const y3 = y2 * ct - z2 * st;
  const z3 = y2 * st + z2 * ct;
  return {x:x3, y:y3, z:z3};
}

function updateScaleInfo(){
  const saturnPx = SATURN_DIAMETER_KM / state.kmPerPx;
  const detail = getDetailLevel();
  scaleInfo.innerHTML =
    'Масштаб: <b>1 px = ' + Math.round(state.kmPerPx).toLocaleString('ru-RU') + ' км</b><br>' +
    'Сатурн: <b>' + saturnPx.toFixed(2) + ' px</b> по диаметру<br>' +
    'Спутников: <b>' + moons.length + '</b><br>' +
    'Уровень детализации: <b>' + detail + '</b>' + (isMobile ? ' · 30 FPS' : ' · 60 FPS');
}
function getDetailLevel(){
  if (state.kmPerPx > 120000) return 'far';
  if (state.kmPerPx > 15000) return 'medium';
  return 'close';
}
function getVisibleMoons(){
  const detail = getDetailLevel();
  let filtered;
  if (detail === 'far') filtered = moons.filter(m => m.diameter_km >= 10);
  else if (detail === 'medium') filtered = moons.filter(m => m.diameter_km >= 2);
  else filtered = moons.slice();
  state.visibleMoons = filtered;
  return filtered;
}
function ringAlphaByDistance(outerKm){ return outerKm <= 480000 ? 0.50 : 0.10; }
function drawProjectedPath(ctx, points, strokeStyle, lineWidth=1, dashed=false){
  if (points.length < 2) return;
  ctx.save();
  if (dashed) ctx.setLineDash([6, 8]);
  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);
  for (let i=1;i<points.length;i++) ctx.lineTo(points[i].x, points[i].y);
  ctx.closePath();
  ctx.strokeStyle = strokeStyle;
  ctx.lineWidth = lineWidth;
  ctx.stroke();
  ctx.restore();
}
function buildProjectedOrbitPoints(rKm, incRad, nodeRad, segments){
  const pts = [];
  for (let i=0;i<segments;i++){
    const t = (i / segments) * Math.PI * 2;
    const p = projectOrbitPoint(rKm, t, incRad, nodeRad);
    const s = worldToScreen(p.x, p.y);
    pts.push({x:s.x, y:s.y});
  }
  return pts;
}
function ringSetFor(detail){
  const ringColorNear = ['214,199,165','201,188,156','191,179,150','173,165,143'];
  const ringColorFar = '171,170,168';
  if (detail === 'far') {
    return [
      {inner:66900, outer:173200, color:ringColorNear[1], alpha:0.50},
      {inner:7720000, outer:12500000, color:ringColorFar, alpha:0.10}
    ];
  }
  if (detail === 'medium') {
    return [
      {inner:66900, outer:173200, color:ringColorNear[1], alpha:0.50},
      {inner:180000, outer:480000, color:ringColorNear[3], alpha:0.16},
      {inner:7720000, outer:12500000, color:ringColorFar, alpha:0.10}
    ];
  }
  return rings.map((r, i) => ({
    inner:r.inner_km,
    outer:r.outer_km,
    color:r.outer_km <= 480000 ? ringColorNear[Math.min(i,3)] : ringColorFar,
    alpha:ringAlphaByDistance(r.outer_km)
  }));
}
function drawRingsHalf(detail, front){
  const ringSet = ringSetFor(detail);
  const cx = state.centerX + state.offsetX;
  const cy = state.centerY + state.offsetY;
  const yScale = Math.cos(VIEW_TILT_RAD);
  for (const r of ringSet){
    const inner = kmRadiusToPx(r.inner), outer = kmRadiusToPx(r.outer);
    const mid = (inner + outer) / 2, width = Math.max(outer - inner, 1);
    sctx.save();
    sctx.translate(cx, cy);
    sctx.scale(1, yScale);
    sctx.beginPath();
    if (front) sctx.arc(0, 0, mid, 0, Math.PI, false);
    else sctx.arc(0, 0, mid, Math.PI, 0, false);
    sctx.strokeStyle = 'rgba(' + r.color + ',' + r.alpha + ')';
    sctx.lineWidth = width;
    sctx.stroke();
    sctx.restore();
  }
}
function drawPixelSaturn(){
  const center = worldToScreen(0,0);
  const r = Math.max(4, kmRadiusToPx(SATURN_RADIUS_KM));

  const grad = sctx.createRadialGradient(
    center.x - r * 0.28,
    center.y - r * 0.30,
    r * 0.10,
    center.x,
    center.y,
    r * 1.05
  );
  grad.addColorStop(0, '#fff7df');
  grad.addColorStop(0.28, '#f1dfb5');
  grad.addColorStop(0.68, '#d9ba82');
  grad.addColorStop(1, '#9e7a4f');

  sctx.beginPath();
  sctx.arc(center.x, center.y, r, 0, Math.PI * 2);
  sctx.fillStyle = grad;
  sctx.fill();

  const shadow = sctx.createRadialGradient(
    center.x + r * 0.26,
    center.y + r * 0.20,
    r * 0.10,
    center.x,
    center.y,
    r
  );
  shadow.addColorStop(0.68, 'rgba(0,0,0,0)');
  shadow.addColorStop(1, 'rgba(0,0,0,0.28)');
  sctx.beginPath();
  sctx.arc(center.x, center.y, r, 0, Math.PI * 2);
  sctx.fillStyle = shadow;
  sctx.fill();

  sctx.beginPath();
  sctx.arc(center.x, center.y, r, 0, Math.PI * 2);
  sctx.strokeStyle = 'rgba(255,245,220,0.20)';
  sctx.lineWidth = 1;
  sctx.stroke();
}
function drawStaticOrbits(visible, detail){
  for (const m of visible){
    if (majorTailNames.has(m.name)) continue;
    if (detail === 'far' && m.diameter_km < 1000) continue;
    const pxR = kmRadiusToPx(m.sma_km);
    if (pxR < 0.7) continue;
    const segments = detail === 'close' ? 36 : 24;
    const pts = buildProjectedOrbitPoints(m.sma_km, m.incRad, m.nodeRad, segments);
    let alpha;
    if (m.diameter_km < 100) alpha = 0.025;
    else if (m.diameter_km < 1000) alpha = detail === 'close' ? 0.06 : 0.045;
    else alpha = detail === 'close' ? 0.11 : 0.075;
    const base = m.diameter_km < 100 ? [200,205,210] : [243,211,106];
    drawProjectedPath(sctx, pts, 'rgba(' + base[0] + ',' + base[1] + ',' + base[2] + ',' + alpha.toFixed(3) + ')', 1);
  }
}
function drawStaticScene(){
  sctx.clearRect(0, 0, state.w, state.h);
  const detail = getDetailLevel();
  const visible = getVisibleMoons();
  drawRingsHalf(detail, false);
  drawStaticOrbits(visible, detail);
  drawPixelSaturn();
  drawRingsHalf(detail, true);
  state.lastDetailLevel = detail;
  state.staticDirty = false;
}
function drawTailOrbit(m, thetaNow){
  const segments = isMobile ? 8 : 12;
  const tailSpan = Math.PI * 0.60;
  const pts = [];
  for (let i=0;i<=segments;i++){
    const t = i / segments;
    const theta = thetaNow - m.direction * (t * tailSpan);
    const p = projectOrbitPoint(m.sma_km, theta, m.incRad, m.nodeRad);
    const s = worldToScreen(p.x, p.y);
    pts.push({x:s.x, y:s.y});
  }
  const base = m.diameter_km < 100 ? [200,205,210] : [243,211,106];
  for (let i=0;i<segments;i++){
    const alpha = (1 - (i / segments)) * 0.62;
    dctx.beginPath();
    dctx.moveTo(pts[i].x, pts[i].y);
    dctx.lineTo(pts[i+1].x, pts[i+1].y);
    dctx.strokeStyle = 'rgba(' + base[0] + ',' + base[1] + ',' + base[2] + ',' + alpha.toFixed(3) + ')';
    dctx.lineWidth = 1;
    dctx.stroke();
  }
}
function drawSelectedOrbit(){
  if (!state.selectedMoon) return;
  const m = state.selectedMoon;
  const pts = buildProjectedOrbitPoints(m.sma_km, m.incRad, m.nodeRad, 52);
  drawProjectedPath(dctx, pts, 'rgba(243,211,106,0.95)', 1);
}
function drawRouteSelectionOrbit(m, color){
  const pts = buildProjectedOrbitPoints(m.sma_km, m.incRad, m.nodeRad, 52);
  drawProjectedPath(dctx, pts, color, 1);
}
function drawMoon(m, detail){
  if (isMobile && detail !== 'close' && m.diameter_km < 100) return;
  const theta = m.phase0 + m.direction * (state.simSeconds / m.periodSec) * Math.PI * 2;
  const p3 = projectOrbitPoint(m.sma_km, theta, m.incRad, m.nodeRad);
  const p = worldToScreen(p3.x, p3.y);
  m.screenX = p.x; m.screenY = p.y;
  const margin = 18;
  if (p.x < -margin || p.x > state.w + margin || p.y < -margin || p.y > state.h + margin) return;

  if (majorTailNames.has(m.name)) drawTailOrbit(m, theta);

  const s = m.sizePx;
  const outlineR = Math.sqrt(2) * s / 2 + 6;
  dctx.beginPath();
  dctx.arc(p.x, p.y, outlineR, 0, Math.PI * 2);
  dctx.strokeStyle = s <= 2 ? 'rgba(255,255,255,0.35)' : 'rgba(255,255,255,0.55)';
  dctx.lineWidth = 1;
  dctx.stroke();
  dctx.fillStyle = moonColor(m);
  dctx.fillRect(Math.round(p.x - s/2), Math.round(p.y - s/2), s, s);

  if (state.selectedMoon && state.selectedMoon.name === m.name){
    dctx.textAlign = 'center';
    dctx.fillStyle = '#ffffff';
    dctx.font = '10px Onest, system-ui, sans-serif';
    dctx.fillText(m.label || m.name, p.x, p.y - outlineR - 10);
    dctx.font = '6px Onest, system-ui, sans-serif';
    dctx.fillStyle = '#c7cbd1';
    dctx.fillText(m.diameter_km + ' км', p.x, p.y - outlineR - 2);
  }
}
function drawRoutePath(){
  if (!state.activeRoute) return;
  const route = state.activeRoute;
  const total = route.totalSimSeconds;
  const elapsed = Math.max(0, state.simSeconds - route.departureSimSeconds);
  const progress = Math.min(1, elapsed / total);

  const pts = [];
  const steps = 60;
  for (let i=0;i<=steps;i++){
    const t = i / steps;
    const u = t;
    const x = route.startPos.x * (1-u) + route.ctrlPos.x * 2 * (1-u) * u + route.endPos.x * u * u;
    const y = route.startPos.y * (1-u) + route.ctrlPos.y * 2 * (1-u) * u + route.endPos.y * u * u;
    pts.push(worldToScreen(x, y));
  }

  dctx.save();
  dctx.setLineDash([6, 10]);
  dctx.lineDashOffset = -state.dashOffset;
  dctx.beginPath();
  dctx.moveTo(pts[0].x, pts[0].y);
  for (let i=1;i<pts.length;i++) dctx.lineTo(pts[i].x, pts[i].y);
  dctx.strokeStyle = 'rgba(124,199,255,0.9)';
  dctx.lineWidth = 1;
  dctx.stroke();
  dctx.restore();

  if (progress >= 1) {
    state.activeRoute = null;
    state.selectedTransportInfo = null;
    return;
  }

  const u = progress;
  const x = route.startPos.x * (1-u) + route.ctrlPos.x * 2 * (1-u) * u + route.endPos.x * u * u;
  const y = route.startPos.y * (1-u) + route.ctrlPos.y * 2 * (1-u) * u + route.endPos.y * u * u;
  const p = worldToScreen(x, y);
  route.currentScreenX = p.x;
  route.currentScreenY = p.y;

  dctx.fillStyle = '#7cc7ff';
  dctx.fillRect(Math.round(p.x - 1), Math.round(p.y - 1), 2, 2);

  const q = 7;
  dctx.strokeStyle = 'rgba(255,255,255,0.9)';
  dctx.lineWidth = 1;
  dctx.beginPath(); dctx.moveTo(p.x-q, p.y-q); dctx.lineTo(p.x-q/2, p.y-q); dctx.stroke();
  dctx.beginPath(); dctx.moveTo(p.x-q, p.y-q); dctx.lineTo(p.x-q, p.y-q/2); dctx.stroke();
  dctx.beginPath(); dctx.moveTo(p.x+q, p.y-q); dctx.lineTo(p.x+q/2, p.y-q); dctx.stroke();
  dctx.beginPath(); dctx.moveTo(p.x+q, p.y-q); dctx.lineTo(p.x+q, p.y-q/2); dctx.stroke();
  dctx.beginPath(); dctx.moveTo(p.x-q, p.y+q); dctx.lineTo(p.x-q/2, p.y+q); dctx.stroke();
  dctx.beginPath(); dctx.moveTo(p.x-q, p.y+q); dctx.lineTo(p.x-q, p.y+q/2); dctx.stroke();
  dctx.beginPath(); dctx.moveTo(p.x+q, p.y+q); dctx.lineTo(p.x+q/2, p.y+q); dctx.stroke();
  dctx.beginPath(); dctx.moveTo(p.x+q, p.y+q); dctx.lineTo(p.x+q, p.y+q/2); dctx.stroke();
}

function paletteForMoon(m){
  const n = m.name;
  if (n === 'Titan') return ['#d9a25b','#b9733d','#eed09c','#7f5834'];
  if (n === 'Enceladus' || n === 'Tethys' || n === 'Dione' || n === 'Rhea') return ['#edf4ff','#d7e4ef','#b3c2d0','#8697aa'];
  if (n === 'Iapetus') return ['#e5dcc8','#9a8a73','#5d5146','#2f2c2a'];
  if (n === 'Hyperion') return ['#c8ab78','#91724e','#6d4f37','#3a2a20'];
  if (n === 'Phoebe') return ['#a3a3a3','#6a6a6a','#3f3f3f','#1f1f1f'];
  if (m.diameter_km > 500) return ['#dcd7cf','#b9b2a8','#8a8279','#5f5954'];
  if (m.diameter_km > 100) return ['#d8d0c6','#b4aca2','#8a8378','#5d5851'];
  return ['#cfd2d8','#9ba1aa','#707780','#4b5058'];
}
function drawPixelMoonIcon(m){
  const pal = paletteForMoon(m);
  ictx.clearRect(0, 0, 16, 16);
  const cx = 8, cy = 8, r = 6.2;
  for (let y=0;y<16;y++){
    for (let x=0;x<16;x++){
      const dx = x + 0.5 - cx, dy = y + 0.5 - cy;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist > r) continue;
      const nx = dx / r, ny = dy / r, nz = Math.sqrt(Math.max(0, 1 - nx*nx - ny*ny));
      const light = Math.max(0, nx * -0.55 + ny * -0.35 + nz * 0.95);
      const noise = hash01(m.name + ':' + x + ':' + y) - 0.5;
      let idx = 1;
      const t = light + noise * 0.18;
      if (t > 0.82) idx = 2;
      else if (t > 0.58) idx = 0;
      else if (t > 0.32) idx = 1;
      else idx = 3;
      if (m.name === 'Iapetus' && x < 8) idx = Math.min(3, idx + 1);
      if (m.name === 'Titan' && (y === 7 || y === 8)) idx = 1;
      if (m.name === 'Enceladus' && noise > 0.35) idx = 2;
      if (m.name === 'Phoebe' && noise < -0.25) idx = 0;
      ictx.fillStyle = pal[idx];
      ictx.fillRect(x, y, 1, 1);
    }
  }
}

function markStaticDirty(){ state.staticDirty = true; }
function hitTest(x, y){
  if (state.activeRoute && state.activeRoute.currentScreenX != null){
    const dxr = x - state.activeRoute.currentScreenX;
    const dyr = y - state.activeRoute.currentScreenY;
    if (Math.hypot(dxr, dyr) <= 16) return {type:'transport', route:state.activeRoute};
  }

  let best = null, bestD = Infinity;
  for (const m of state.visibleMoons){
    if (typeof m.screenX !== 'number' || typeof m.screenY !== 'number') continue;
    const dx = x - m.screenX, dy = y - m.screenY;
    const d = Math.hypot(dx, dy);
    const hitR = Math.max(16, Math.sqrt(2) * m.sizePx / 2 + 8);
    if (d <= hitR && d < bestD){ best = m; bestD = d; }
  }
  return best ? {type:'moon', moon:best} : null;
}

function estimateRouteOption(fromMoon, toMoon, transport, departSimSeconds){
  const r1 = fromMoon.sma_km;
  const r2 = toMoon.sma_km;
  const distance = Math.abs(r2 - r1);
  const saturnPenalty = (Math.min(r1, r2) < 200000) ? 0.18 : 0.0;
  const ringPenalty = (Math.min(r1, r2) < 173200 && Math.max(r1, r2) > 66900) ? 0.25 : 0.0;
  const gravityPenalty = saturnPenalty + ringPenalty;

  const accel = transport.accel_ms2;
  const cruiseLimit = transport.deltaV_kms * 1000;
  const halfDistM = (distance * 1000) / 2;
  const accelTime = Math.min(Math.sqrt((2 * halfDistM) / Math.max(accel, 0.01)), cruiseLimit / Math.max(accel, 0.01));
  const accelDist = 0.5 * accel * accelTime * accelTime;
  let totalTimeSec;
  let peakSpeed = accel * accelTime;

  if (accelDist * 2 >= distance * 1000) {
    totalTimeSec = 2 * Math.sqrt((distance * 1000) / Math.max(accel, 0.01));
    peakSpeed = Math.sqrt((distance * 1000) * Math.max(accel, 0.01));
  } else {
    const cruiseDist = distance * 1000 - 2 * accelDist;
    totalTimeSec = accelTime * 2 + cruiseDist / Math.max(peakSpeed, 1);
  }

  totalTimeSec *= (1 + gravityPenalty);
  const days = Math.max(1, totalTimeSec / 86400);
  const cost = transport.costPerDay * days;

  const fuelFraction = Math.min(0.78, 0.18 + (peakSpeed / 1000) / Math.max(transport.deltaV_kms, 1) * 0.55 + gravityPenalty * 0.20);
  const reserveFraction = 0.20;
  const fuelMass = transport.mass_t * Math.min(0.95, fuelFraction + reserveFraction);

  return {
    departSimSeconds,
    arrivalSimSeconds: departSimSeconds + totalTimeSec,
    totalSimSeconds: totalTimeSec,
    cost,
    fuelMass_t: fuelMass,
    peakSpeed_kms: peakSpeed / 1000
  };
}

function evaluateUrgentAndBest(fromMoon, toMoon, transport){
  const urgent = estimateRouteOption(fromMoon, toMoon, transport, state.simSeconds);

  const w1 = 2 * Math.PI / Math.abs(fromMoon.periodSec || 1);
  const w2 = 2 * Math.PI / Math.abs(toMoon.periodSec || 1);
  let best = null;
  for (let step = 0; step <= 7 * 24; step++){
    const t = state.simSeconds + step * 3600;
    const a1 = fromMoon.phase0 + fromMoon.direction * w1 * t;
    const a2 = toMoon.phase0 + toMoon.direction * w2 * t;
    let delta = Math.abs((a1 - a2) % (Math.PI * 2));
    if (delta > Math.PI) delta = Math.PI * 2 - delta;
    const candidate = estimateRouteOption(fromMoon, toMoon, transport, t);
    const score = candidate.totalSimSeconds + delta * 80000;
    if (!best || score < best.score){
      best = {...candidate, score, angularGap:delta};
    }
  }
  return {urgent, best};
}

function openTransportPanel(){
  if (!state.routeA || !state.routeB) return;
  state.routeSelectedTransport = null;
  routeTransportText.innerHTML = 'Маршрут: <b>' + state.routeA.label + '</b> → <b>' + state.routeB.label + '</b>';
  routeTransportList.innerHTML = '';
  for (const tr of transportTypes){
    const div = document.createElement('div');
    div.className = 'routeCard';
    div.innerHTML =
      '<div class="routeCardTitle">' + tr.ru + ' "' + tr.name + '"</div>' +
      '<div class="routeCardMeta">Масса: ' + formatMoney(tr.mass_t) + ' т<br>' +
      'Свободный объём: ' + formatMoney(tr.freeVolume_m3) + ' м³<br>' +
      'ΔV: ' + tr.deltaV_kms + ' км/с<br>' +
      'Фрахт: ' + formatMoney(tr.costPerDay) + ' / сутки</div>';
    div.addEventListener('click', () => {
      state.routeSelectedTransport = tr;
      [...routeTransportList.children].forEach(c => c.classList.remove('active'));
      div.classList.add('active');
    });
    routeTransportList.appendChild(div);
  }
  routeTransportPanel.classList.add('open');
}

function openTimingPanel(){
  const tr = state.routeSelectedTransport;
  if (!tr) return;
  routeTransportPanel.classList.remove('open');
  routeTimingPanel.classList.add('open');
  routeTimingText.innerHTML = 'Транспорт: <b>' + tr.ru + ' "' + tr.name + '"</b>';
  routeTimingList.innerHTML = '';
  state.routeSelectedTiming = null;

  const variants = evaluateUrgentAndBest(state.routeA, state.routeB, tr);
  const cards = [
    {
      key:'urgent',
      title:'Срочный',
      option:variants.urgent,
      launchText:'Немедленно'
    },
    {
      key:'best',
      title:'Выгодный',
      option:variants.best,
      launchText:'Отправка: ' + formatSimDate(SIM_START_MS + variants.best.departSimSeconds * 1000)
    }
  ];

  for (const item of cards){
    const days = item.option.totalSimSeconds / 86400;
    const div = document.createElement('div');
    div.className = 'routeCard';
    div.innerHTML =
      '<div class="routeCardTitle">' + item.title + '</div>' +
      '<div class="routeCardMeta">Стоимость: ' + formatMoney(item.option.cost) + '<br>' +
      'Время в пути: ' + days.toFixed(2) + ' суток<br>' +
      item.launchText + '</div>';
    div.addEventListener('click', () => {
      state.routeSelectedTiming = item;
      [...routeTimingList.children].forEach(c => c.classList.remove('active'));
      div.classList.add('active');
    });
    routeTimingList.appendChild(div);
  }
}

function currentMoonPosition(m, simSeconds){
  const theta = m.phase0 + m.direction * (simSeconds / m.periodSec) * Math.PI * 2;
  return projectOrbitPoint(m.sma_km, theta, m.incRad, m.nodeRad);
}

function confirmRoute(){
  const tr = state.routeSelectedTransport;
  const timing = state.routeSelectedTiming;
  if (!tr || !timing) return;
  if (state.money < timing.option.cost) {
    alert('Недостаточно средств.');
    return;
  }

  state.money -= timing.option.cost;
  updateMoneyBox();

  const startPos = currentMoonPosition(state.routeA, timing.option.departSimSeconds);
  const endPos = currentMoonPosition(state.routeB, timing.option.arrivalSimSeconds);
  const midX = (startPos.x + endPos.x) / 2;
  const midY = (startPos.y + endPos.y) / 2;
  const dx = endPos.x - startPos.x;
  const dy = endPos.y - startPos.y;
  const len = Math.max(1, Math.hypot(dx, dy));
  const nx = -dy / len;
  const ny = dx / len;
  const bow = Math.min(900000, len * 0.25);

  state.activeRoute = {
    from:state.routeA,
    to:state.routeB,
    transport:tr,
    departureSimSeconds:timing.option.departSimSeconds,
    arrivalSimSeconds:timing.option.arrivalSimSeconds,
    totalSimSeconds:timing.option.totalSimSeconds,
    startPos,
    endPos,
    ctrlPos:{x:midX + nx * bow, y:midY + ny * bow},
    cost:timing.option.cost,
    fuelMass_t:timing.option.fuelMass_t,
    peakSpeed_kms:timing.option.peakSpeed_kms,
    currentScreenX:null,
    currentScreenY:null
  };

  state.routeMode = false;
  routeModeBtn.classList.remove('active');
  state.routeA = null;
  state.routeB = null;
  state.routeSelectedTransport = null;
  state.routeSelectedTiming = null;
  routeTransportPanel.classList.remove('open');
  routeTimingPanel.classList.remove('open');
}

function toggleRouteMode(){
  state.routeMode = !state.routeMode;
  routeModeBtn.classList.toggle('active', state.routeMode);
  state.routeA = null;
  state.routeB = null;
  routeTransportPanel.classList.remove('open');
  routeTimingPanel.classList.remove('open');
  if (state.routeMode){
    state.pausedBeforeRoute = state.speedMode;
    setSpeed(0);
  }
}

function handleRouteSelection(moon){
  if (!state.routeMode) return false;
  if (!state.routeA || state.routeA.name === moon.name){
    state.routeA = state.routeA && state.routeA.name === moon.name ? null : moon;
    return true;
  }
  if (!state.routeB || state.routeB.name === moon.name){
    state.routeB = state.routeB && state.routeB.name === moon.name ? null : moon;
    if (state.routeA && state.routeB) openTransportPanel();
    return true;
  }
  return true;
}

function render(ts){
  if (!state.lastRenderTs) state.lastRenderTs = ts;
  const minFrame = 1000 / targetFPS;
  const elapsedMs = ts - state.lastRenderTs;
  if (elapsedMs < minFrame){ requestAnimationFrame(render); return; }

  const dt = elapsedMs / 1000;
  state.lastRenderTs = ts;
  state.frameCount++;

  if (state.speedMode === 1) state.simSeconds += dt;
  if (state.speedMode === 60) state.simSeconds += dt * 60;
  if (state.speedMode === 3600) state.simSeconds += dt * 3600;
  state.dashOffset += dt * 20;
  updateSimTimeBox();

  const detail = getDetailLevel();
  if (state.staticDirty || detail !== state.lastDetailLevel){
    drawStaticScene();
    updateScaleInfo();
  } else {
    getVisibleMoons();
  }

  dctx.clearRect(0,0,state.w,state.h);
  if (state.selectedMoon) drawSelectedOrbit();
  if (state.routeMode && state.routeA) drawRouteSelectionOrbit(state.routeA, 'rgba(111,227,162,0.95)');
  if (state.routeMode && state.routeB) drawRouteSelectionOrbit(state.routeB, 'rgba(124,199,255,0.95)');
  for (const m of state.visibleMoons) drawMoon(m, detail);
  drawRoutePath();

  requestAnimationFrame(render);
}

function setSpeed(mode){
  state.speedMode = mode;
  document.getElementById('pauseBtn').classList.toggle('active', mode === 0);
  document.getElementById('realBtn').classList.toggle('active', mode === 1);
  document.getElementById('minuteBtn').classList.toggle('active', mode === 60);
  document.getElementById('hourBtn').classList.toggle('active', mode === 3600);
}
function bindTap(id, fn){
  const el = document.getElementById(id);
  el.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); fn(); }, false);
}

bindTap('pauseBtn', () => setSpeed(0));
bindTap('realBtn', () => setSpeed(1));
bindTap('minuteBtn', () => setSpeed(60));
bindTap('hourBtn', () => setSpeed(3600));
bindTap('infoBtn', () => { infoSheet.classList.toggle('open'); });
bindTap('routeModeBtn', () => toggleRouteMode());
bindTap('routeTransportCancelBtn', () => { routeTransportPanel.classList.remove('open'); state.routeSelectedTransport = null; });
bindTap('routeTransportNextBtn', () => openTimingPanel());
bindTap('routeTimingBackBtn', () => { routeTimingPanel.classList.remove('open'); routeTransportPanel.classList.add('open'); });
bindTap('routeConfirmBtn', () => confirmRoute());

dynamicCanvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const beforeX = (e.clientX - state.centerX - state.offsetX) * state.kmPerPx;
  const beforeY = (e.clientY - state.centerY - state.offsetY) * state.kmPerPx;
  state.kmPerPx = Math.max(100, Math.min(maxStructureKm, state.kmPerPx * (e.deltaY > 0 ? 1.12 : 0.9)));
  state.offsetX = e.clientX - state.centerX - beforeX / state.kmPerPx;
  state.offsetY = e.clientY - state.centerY - beforeY / state.kmPerPx;
  markStaticDirty();
}, {passive:false});

dynamicCanvas.addEventListener('pointerdown', (e) => {
  dynamicCanvas.setPointerCapture(e.pointerId);
  state.pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  state.moved = false;
  state.downAt = performance.now();
});
dynamicCanvas.addEventListener('pointermove', (e) => {
  if (!state.pointers.has(e.pointerId)) return;
  const prev = state.pointers.get(e.pointerId);
  state.pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});

  if (state.pointers.size === 1){
    const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
    if (Math.abs(dx) + Math.abs(dy) > 2) state.moved = true;
    state.offsetX += dx; state.offsetY += dy; markStaticDirty();
  } else if (state.pointers.size === 2){
    state.moved = true;
    const pts = [...state.pointers.values()];
    const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    if (!state.pinchBaseDistance){
      state.pinchBaseDistance = d; state.pinchBaseKmPerPx = state.kmPerPx;
    } else if (d > 0){
      state.kmPerPx = Math.max(100, Math.min(maxStructureKm, state.pinchBaseKmPerPx * (state.pinchBaseDistance / d)));
      markStaticDirty();
    }
  }
});
function clearPointer(e){
  state.pointers.delete(e.pointerId);
  if (state.pointers.size < 2){ state.pinchBaseDistance = null; state.pinchBaseKmPerPx = null; }
}
dynamicCanvas.addEventListener('pointerup', (e) => {
  const wasTap = !state.moved && (performance.now() - state.downAt < 250);
  if (wasTap){
    const hit = hitTest(e.clientX, e.clientY);
    if (hit && hit.type === 'transport') showTransportInfo(hit.route);
    else if (hit && hit.type === 'moon'){
      if (!handleRouteSelection(hit.moon)) showInfo(hit.moon);
      else if (!state.routeMode) showInfo(hit.moon);
    } else if (!state.routeMode) {
      showInfo(null);
    }
  }
  clearPointer(e);
});
dynamicCanvas.addEventListener('pointercancel', clearPointer);
dynamicCanvas.addEventListener('click', (e) => {
  const hit = hitTest(e.clientX, e.clientY);
  if (hit && hit.type === 'transport') showTransportInfo(hit.route);
  else if (hit && hit.type === 'moon'){
    if (!handleRouteSelection(hit.moon)) showInfo(hit.moon);
    else if (!state.routeMode) showInfo(hit.moon);
  } else if (!state.routeMode) {
    showInfo(null);
  }
});

window.addEventListener('resize', resize);
resize();
fitAll();
updateMoneyBox();
updateSimTimeBox();
setSpeed(0);
requestAnimationFrame(render);
</script>
</body>
