<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Saturn System Suka</title>
<style>
:root {
  --bg:#050608; --panel:rgba(8,10,14,.88); --text:#f2f2f2; --muted:#aeb4be;
  --yellow:#f3d36a; --light-orbit:rgba(200,205,210,.30);
  --big-orbit:rgba(243,211,106,.33); --purple:#9f7dff;
}
*{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;height:100%;overflow:hidden}
#app{position:fixed;inset:0}
canvas{width:100%;height:100%;display:block;touch-action:none}

.topbar {
  position: fixed;
  top: max(8px, env(safe-area-inset-top));
  right: 8px;
  z-index: 30;
}
.iconBtn {
  width: 36px; height: 36px; border-radius: 999px;
  display:flex; align-items:center; justify-content:center;
  border:1px solid rgba(255,255,255,.14);
  background: rgba(8,10,14,.78); color: var(--text);
  font-size: 18px; font-weight: 700;
  backdrop-filter: blur(8px);
  touch-action: manipulation;
}

.infoSheet {
  position: fixed;
  top: max(50px, calc(env(safe-area-inset-top) + 50px));
  right: 8px;
  width: min(88vw, 320px);
  max-height: min(62vh, 520px);
  overflow: auto;
  background: var(--panel);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 14px;
  padding: 12px;
  display: none;
  z-index: 35;
  backdrop-filter: blur(10px);
}
.infoSheet.open{display:block}
.title{font-size:14px;font-weight:700;margin-bottom:8px}
.meta{font-size:11px;color:var(--muted);line-height:1.4}
.legend{display:grid;gap:5px;font-size:11px;color:var(--muted);margin-top:10px}

.controls {
  position: fixed;
  left: 8px; right: 8px;
  bottom: max(8px, env(safe-area-inset-bottom));
  z-index: 25;
}
.panel {
  background: rgba(8,10,14,.78);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 14px;
  padding: 8px;
}
.grid {
  display:grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 6px;
}
.grid.secondary {
  grid-template-columns: repeat(5, minmax(0, 1fr));
  margin-top: 6px;
}
.grid.oneRow {
  grid-template-columns: repeat(4, minmax(0, 1fr));
}

button.control {
  appearance:none;
  min-height: 42px;
  border:1px solid rgba(255,255,255,.12);
  background: rgba(255,255,255,.06);
  color: var(--text);
  border-radius: 10px;
  padding: 8px 6px;
  font-size: 11px;
  line-height: 1.15;
  font-weight: 700;
  text-align: center;
  touch-action: manipulation;
}
button.control.active {
  background: rgba(243,211,106,.16);
  border-color: rgba(243,211,106,.45);
  color: var(--yellow);
}

.infoBox {
  position: fixed;
  left: 8px;
  right: 8px;
  bottom: max(66px, calc(env(safe-area-inset-bottom) + 66px));
  margin: 0 auto;
  width: min(92vw, 340px);
  background: var(--panel);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 12px;
  padding: 10px 12px;
  font-size: 12px;
  line-height: 1.35;
  display: none;
  z-index: 28;
}

@media (max-width: 390px) {
  .controls { left: 6px; right: 6px; }
  .grid { gap: 5px; }
  .grid.oneRow { gap: 5px; }
  button.control { min-height: 40px; font-size: 10px; padding: 7px 4px; }
  .infoBox { bottom: max(70px, calc(env(safe-area-inset-bottom) + 70px)); }
}

@media (min-width: 700px) {
  .controls{left:10px; right:10px; max-width: 640px; margin: 0 auto;}
  button.control{font-size:12px; min-height:44px;}
}

.controls, .controls *, .topbar, .topbar *, .infoSheet, .infoSheet * {
  touch-action: manipulation;
}

</style>
</head>

<div id="app"><canvas id="c"></canvas></div>

<div class="topbar">

</div>

</div>

<div class="controls">

  </div>
</div>

ma_km": 25207100.0, "period_d": -1494.41}, {"name": "S/2006 S 29", "diameter_km": 3.0, "sma_km": 25212100.0, "period_d": -1494.78}, {"name": "S/2020 S 10", "diameter_km": 3.0, "sma_km": 25315300.0, "period_d": -1503.97}, {"name": "S/2020 S 42", "diameter_km": 3.0, "sma_km": 25329400.0, "period_d": -1505.31}, {"name": "S/2020 S 9", "diameter_km": 4.0, "sma_km": 25408700.0, "period_d": -1512.38}, {"name": "S/2023 S 5", "diameter_km": 3.0, "sma_km": 25583500.0, "period_d": -1528.04}, {"name": "S/2020 S 41", "diameter_km": 3.0, "sma_km": 25876400.0, "period_d": -1554.4}, {"name": "S/2004 S 26", "diameter_km": 5.0, "sma_km": 26097500.0, "period_d": -1574.25}, {"name": "S/2019 S 21", "diameter_km": 4.0, "sma_km": 26439500.0, "period_d": -1605.28}, {"name": "S/2004 S 52", "diameter_km": 3.0, "sma_km": 26446400.0, "period_d": -1605.89}, {"name": "S/2020 S 43", "diameter_km": 3.0, "sma_km": 26657400.0, "period_d": -1625.29}, {"name": "S/2019 S 43", "diameter_km": 3.0, "sma_km": 26664100.0, "period_d": -1625.9}, {"name": "S/2019 S 44", "diameter_km": 3.0, "sma_km": 26796900.0, "period_d": -1638.11}, {"name": "S/2020 S 44", "diameter_km": 3.0, "sma_km": 27259400.0, "period_d": -1680.64}];
const rings = [{"name": "D Ring", "inner_km": 66900, "outer_km": 74491}, {"name": "C Ring", "inner_km": 74491, "outer_km": 91975}, {"name": "B Ring", "inner_km": 91975, "outer_km": 117570}, {"name": "Cassini Division", "inner_km": 117500, "outer_km": 122050}, {"name": "A Ring", "inner_km": 122050, "outer_km": 136770}, {"name": "Roche Division", "inner_km": 136770, "outer_km": 139380}, {"name": "F Ring", "inner_km": 139826, "outer_km": 140612}, {"name": "Janus/Epimetheus Ring", "inner_km": 149000, "outer_km": 154000}, {"name": "G Ring", "inner_km": 166000, "outer_km": 173200}, {"name": "E Ring", "inner_km": 180000, "outer_km": 480000}, {"name": "Methone Ring", "inner_km": 194440, "outer_km": 194440}, {"name": "Anthe Ring", "inner_km": 197655, "outer_km": 197655}, {"name": "Pallene Ring", "inner_km": 212280, "outer_km": 212280}, {"name": "Phoebe Ring", "inner_km": 7720000, "outer_km": 12500000}];

const SATURN_RADIUS_KM = 58232;
const SATURN_DIAMETER_KM = SATURN_RADIUS_KM * 2;
const maxMoonRadiusKm = Math.max(...moons.map(m => m.sma_km));
const maxStructureKm = Math.max(maxMoonRadiusKm, ...rings.map(r => r.outer_km));
const allMoonCount = moons.length;

function pxBucket(d){
  if (d < 10) return 1;
  if (d < 100) return 2;
  if (d < 300) return 3;
  if (d < 700) return 4;
  if (d < 1200) return 5;
  if (d < 2100) return 6;
  if (d < 4000) return 7;
  return 8;
}
function getCSS(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function moonColor(m){ return m.diameter_km > 1000 ? getCSS('--purple') : getCSS('--text'); }
function orbitColor(m){ return m.diameter_km < 100 ? getCSS('--light-orbit') : getCSS('--big-orbit'); }
function hashPhase(name){ let h=2166136261>>>0; for(let i=0;i<name.length;i++){ h^=name.charCodeAt(i); h=Math.imul(h,16777619); } return (h>>>0)/4294967295*Math.PI*2; }

for (const m of moons) {
  m.sizePx = pxBucket(m.diameter_km);
  m.phase0 = hashPhase(m.name);
  m.direction = m.period_d < 0 ? -1 : 1;
  m.periodSec = Math.abs(m.period_d) * 86400;
}

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const infoBox = document.getElementById('infoBox');
const infoSheet = document.getElementById('infoSheet');
const scaleInfo = document.getElementById('scaleInfo');

const state = {
  w:0,h:0,centerX:0,centerY:0,offsetX:0,offsetY:0,
  kmPerPx:1,baseKmPerPx:1,speedMode:0,showLabels:true,simSeconds:0,lastTs:performance.now(),
  pointers:new Map(),pinchBaseKmPerPx:null,pinchBaseDistance:null,moved:false,downAt:0
};

function resize() {
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  canvas.width = Math.floor(innerWidth * dpr);
  canvas.height = Math.floor(innerHeight * dpr);
  canvas.style.width = innerWidth + 'px';
  canvas.style.height = innerHeight + 'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  state.w = innerWidth; state.h = innerHeight;
  state.centerX = innerWidth / 2; state.centerY = innerHeight / 2;
  if (!state.baseKmPerPx || !isFinite(state.baseKmPerPx)) fitAll();
  updateScaleInfo();
}

function fitAll() {
  const controlsHeight = state.w <= 390 ? 118 : 132;
  const usableX = state.w * 0.46;
  const usableY = Math.max(110, (state.h - controlsHeight) * 0.34);
  const usable = Math.min(usableX, usableY);
  state.baseKmPerPx = maxStructureKm / usable;
  state.kmPerPx = state.baseKmPerPx;
  state.offsetX = 0;
  state.offsetY = -22;
  updateScaleInfo();
}

function fitRings() {
  const outer = Math.max(...rings.map(r => r.outer_km));
  const controlsHeight = state.w <= 390 ? 118 : 132;
  const usable = Math.min(state.w * 0.42, Math.max(105, (state.h - controlsHeight) * 0.30));
  state.kmPerPx = outer / usable;
  state.offsetX = 0;
  state.offsetY = -22;
  updateScaleInfo();
}

function worldToScreen(xKm, yKm) {
  return {
    x: state.centerX + state.offsetX + xKm / state.kmPerPx,
    y: state.centerY + state.offsetY + yKm / state.kmPerPx
  };
}
function kmRadiusToPx(km) { return km / state.kmPerPx; }

function updateScaleInfo() {
  const saturnPx = SATURN_DIAMETER_KM / state.kmPerPx;
  scaleInfo.innerHTML =
    'Масштаб: 1 px = <b>' + Math.round(state.kmPerPx).toLocaleString('ru-RU') + ' км</b><br>' +
    'Сатурн в реальном линейном масштабе: <b>' + saturnPx.toFixed(2) + ' px</b> по диаметру<br>' +
    'Объектов: <b>' + allMoonCount + '</b>, внешний охват по орбитам: <b>' + Math.round(maxMoonRadiusKm).toLocaleString('ru-RU') + ' км</b>';
}

function ringAlphaByDistance(outerKm) {
  return outerKm <= 480000 ? 0.50 : 0.10;
}

function drawRings() {
  const center = worldToScreen(0,0);
  for (const r of rings) {
    const inner = kmRadiusToPx(r.inner_km);
    const outer = kmRadiusToPx(r.outer_km);
    const width = Math.max(outer - inner, 1);
    const alpha = ringAlphaByDistance(r.outer_km);
    ctx.beginPath();
    ctx.arc(center.x, center.y, (inner + outer) / 2, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(143,148,154,' + alpha + ')';
    ctx.lineWidth = width;
    ctx.stroke();
  }
}

function drawSaturn() {
  const center = worldToScreen(0,0);
  const r = Math.max(0.5, kmRadiusToPx(SATURN_RADIUS_KM));
  ctx.beginPath();
  ctx.arc(center.x, center.y, r, 0, Math.PI * 2);
  ctx.fillStyle = getCSS('--yellow');
  ctx.fill();
}

function drawOrbit(m) {
  const center = worldToScreen(0,0);
  const r = kmRadiusToPx(m.sma_km);
  if (r < 0.7) return;

  const isLarge = m.diameter_km >= 1000;
  const isMedium = m.diameter_km >= 100;
  const isSmall = m.diameter_km < 100;

  // Tiny / distant orbits: cheap faint full circle to reduce load.
  if (isSmall) {
    ctx.beginPath();
    ctx.arc(center.x, center.y, r, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(200,205,210,0.06)';
    ctx.lineWidth = 1;
    ctx.stroke();
    return;
  }

  const thetaNow = m.phase0 + m.direction * (state.simSeconds / m.periodSec) * Math.PI * 2;

  // Medium moons get shorter and simpler tails.
  const segments = isLarge ? 28 : 12;
  const tailSpan = isLarge ? Math.PI * 2 : Math.PI * 0.65;

  for (let i = 0; i < segments; i++) {
    const t0 = i / segments;
    const t1 = (i + 1) / segments;

    const a0 = thetaNow - m.direction * (t0 * tailSpan);
    const a1 = thetaNow - m.direction * (t1 * tailSpan);

    const fade = 1 - t0;
    const alpha = isLarge ? (fade * 0.95) : (fade * 0.45);
    if (alpha <= 0.01) continue;

    ctx.beginPath();
    ctx.arc(center.x, center.y, r, a1, a0, m.direction < 0);
    const base = isMedium ? [243,211,106] : [200,205,210];
    ctx.strokeStyle = 'rgba(' + base[0] + ',' + base[1] + ',' + base[2] + ',' + alpha.toFixed(3) + ')';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
}

function drawMoon(m) {
  const theta = m.phase0 + m.direction * (state.simSeconds / m.periodSec) * Math.PI * 2;
  const x = Math.cos(theta) * m.sma_km;
  const y = Math.sin(theta) * m.sma_km;
  const p = worldToScreen(x, y);
  m.screenX = p.x; m.screenY = p.y;

  const s = m.sizePx;
  const outlineR = Math.sqrt(2) * s / 2 + 6;

  ctx.beginPath();
  ctx.arc(p.x, p.y, outlineR, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255,255,255,0.55)';
  ctx.lineWidth = 1;
  ctx.stroke();

  ctx.fillStyle = moonColor(m);
  ctx.fillRect(Math.round(p.x - s / 2), Math.round(p.y - s / 2), s, s);

  if (state.showLabels) {
    const labelAlpha = Math.max(0.10, Math.min(1, 90000 / state.kmPerPx));
    ctx.globalAlpha = labelAlpha;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffffff';
    ctx.font = '10px system-ui,-apple-system,Segoe UI,Roboto,sans-serif';
    ctx.fillText(m.name, p.x, p.y - outlineR - 10);
    ctx.font = '6px system-ui,-apple-system,Segoe UI,Roboto,sans-serif';
    ctx.fillStyle = '#c7cbd1';
    ctx.fillText(m.diameter_km + ' км', p.x, p.y - outlineR - 2);
    ctx.globalAlpha = 1;
  }
}

function render(ts) {
  const dt = Math.min(0.05, (ts - state.lastTs) / 1000);
  state.lastTs = ts;
  if (state.speedMode === 1) state.simSeconds += dt;
  if (state.speedMode === 3600) state.simSeconds += dt * 3600;
  ctx.clearRect(0,0,state.w,state.h);
  drawRings();
  for (const m of moons) drawOrbit(m);
  drawSaturn();
  for (const m of moons) drawMoon(m);
  requestAnimationFrame(render);
}

function setSpeed(mode) {
  state.speedMode = mode;
  document.getElementById('pauseBtn').classList.toggle('active', mode === 0);
  document.getElementById('realBtn').classList.toggle('active', mode === 1);
  document.getElementById('hourBtn').classList.toggle('active', mode === 3600);
}

function zoomAt(factor, clientX = state.centerX, clientY = state.centerY) {
  const beforeX = (clientX - state.centerX - state.offsetX) * state.kmPerPx;
  const beforeY = (clientY - state.centerY - state.offsetY) * state.kmPerPx;
  state.kmPerPx = Math.max(100, Math.min(maxStructureKm, state.kmPerPx * factor));
  state.offsetX = clientX - state.centerX - beforeX / state.kmPerPx;
  state.offsetY = clientY - state.centerY - beforeY / state.kmPerPx;
  updateScaleInfo();
}

function hitTest(x, y) {
  let best = null, bestD = Infinity;
  for (const m of moons) {
    const dx = x - (m.screenX ?? -99999);
    const dy = y - (m.screenY ?? -99999);
    const d = Math.hypot(dx, dy);
    const hitR = Math.max(16, Math.sqrt(2) * m.sizePx / 2 + 8);
    if (d <= hitR && d < bestD) { best = m; bestD = d; }
  }
  return best;
}

function showInfo(m) {
  if (!m) { infoBox.style.display = 'none'; return; }
  infoBox.innerHTML =
    '<b>' + m.name + '</b><br>' +
    'Диаметр: ' + m.diameter_km + ' км<br>' +
    'Большая полуось: ' + Math.round(m.sma_km).toLocaleString('ru-RU') + ' км<br>' +
    'Период: ' + Math.abs(m.period_d).toLocaleString('ru-RU') + ' суток<br>' +
    'Направление: ' + (m.period_d < 0 ? 'ретроградное' : 'прямое');
  infoBox.style.display = 'block';
}

function bindTap(id, fn) {
  const el = document.getElementById(id);
  el.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    fn();
  }, false);
}

bindTap('pauseBtn', () => setSpeed(0));
bindTap('realBtn', () => setSpeed(1));
bindTap('hourBtn', () => setSpeed(3600));
bindTap('labelsBtn', () => {
  state.showLabels = !state.showLabels;
  document.getElementById('labelsBtn').classList.toggle('active', state.showLabels);
});
bindTap('infoBtn', () => infoSheet.classList.toggle('open'));

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  zoomAt(e.deltaY > 0 ? 1.12 : 0.9, e.clientX, e.clientY);
}, { passive:false });

canvas.addEventListener('pointerdown', (e) => {
  canvas.setPointerCapture(e.pointerId);
  state.pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  state.moved = false;
  state.downAt = performance.now();
});

canvas.addEventListener('pointermove', (e) => {
  if (!state.pointers.has(e.pointerId)) return;
  const prev = state.pointers.get(e.pointerId);
  state.pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (state.pointers.size === 1) {
    const dx = e.clientX - prev.x;
    const dy = e.clientY - prev.y;
    if (Math.abs(dx) + Math.abs(dy) > 2) state.moved = true;
    state.offsetX += dx;
    state.offsetY += dy;
  } else if (state.pointers.size === 2) {
    state.moved = true;
    const pts = [...state.pointers.values()];
    const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    if (!state.pinchBaseDistance) {
      state.pinchBaseDistance = d;
      state.pinchBaseKmPerPx = state.kmPerPx;
    } else if (d > 0) {
      state.kmPerPx = Math.max(100, Math.min(maxStructureKm, state.pinchBaseKmPerPx * (state.pinchBaseDistance / d)));
      updateScaleInfo();
    }
  }
});

function clearPointer(e) {
  state.pointers.delete(e.pointerId);
  if (state.pointers.size < 2) {
    state.pinchBaseDistance = null;
    state.pinchBaseKmPerPx = null;
  }
}

canvas.addEventListener('pointerup', (e) => {
  const wasTap = !state.moved && (performance.now() - state.downAt < 250);
  if (wasTap) {
    const hit = hitTest(e.clientX, e.clientY);
    if (hit) showInfo(hit); else infoBox.style.display = 'none';
  }
  clearPointer(e);
});
canvas.addEventListener('pointercancel', clearPointer);
canvas.addEventListener('click', (e) => {
  const hit = hitTest(e.clientX, e.clientY);
  if (hit) showInfo(hit);
  else infoBox.style.display = 'none';
});


window.addEventListener('resize', resize);
resize();
fitAll();
setSpeed(0);
requestAnimationFrame(render);
</script>
